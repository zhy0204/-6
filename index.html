<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIDC 生態保費試算系統</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --ink: #0f172a;
  --mut: #64748b;
  --line: #e2e8f0;
  --accent: #0284c7;
  --accent-soft: rgba(2, 132, 199, 0.08);
  --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
  --radius: 20px;
}
:root[data-theme="dark"] {
  --bg: #090d16;
  --card: #111827;
  --ink: #f8fafc;
  --mut: #94a3b8;
  --line: rgba(255, 255, 255, 0.08);
  --accent: #38bdf8;
  --accent-soft: rgba(56, 189, 248, 0.12);
  --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
  font-size: 14px; line-height: 1.6; padding: 32px 20px 80px;
  transition: background 0.3s ease, color 0.3s ease;
}

.w { max-width: 1100px; margin: auto; }

.header-bar {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 32px 36px; margin-bottom: 24px; box-shadow: var(--shadow);
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;
}
.header-bar h1 { font-size: 26px; margin: 0 0 6px; font-weight: 800; letter-spacing: -0.5px; }
.header-bar p { color: var(--mut); margin: 0; font-size: 14px; }

.tabs {
  display: flex; gap: 8px; background: var(--card); border-radius: 99px; padding: 8px;
  width: max-content; max-width: 100%; margin: 0 auto 28px; overflow-x: auto;
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
.tabs button {
  border: 0; background: transparent; color: var(--mut); padding: 12px 24px;
  border-radius: 99px; font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.2s;
}
.tabs button:hover { color: var(--ink); background: var(--accent-soft); }
.tabs button.on { background: var(--accent); color: #fff; box-shadow: 0 4px 14px var(--accent-soft); }

.g { display: grid; gap: 20px; }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g2 { grid-template-columns: repeat(2, 1fr); }
@media(max-width: 900px) { .g4 { grid-template-columns: 1fr 1fr; } }
@media(max-width: 600px) { .g4, .g2 { grid-template-columns: 1fr; } }

.c {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 28px; box-shadow: var(--shadow); margin-bottom: 20px;
}
.c h2 { font-size: 20px; margin: 0 0 8px; font-weight: 800; letter-spacing: -0.3px; }

.k { color: var(--mut); font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.big { font-size: 32px; font-weight: 800; margin: 8px 0 2px; letter-spacing: -1px; }
.big small { font-size: 14px; font-weight: 600; color: var(--mut); }

.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.in { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
.in:last-child { border: 0; }

input[type=number], input[type=text], textarea, input[type=date] {
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 12px; color: var(--accent); font-family: inherit; font-weight: 700; width: 140px; text-align: right; outline: none; transition: 0.2s;
}
input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { width: 100%; text-align: left; color: var(--ink); font-weight: 400; min-height: 130px; resize: vertical; }

.seg { display: flex; background: var(--bg); border-radius: 12px; padding: 4px; border: 1px solid var(--line); margin: 12px 0; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--mut); font: inherit; font-weight: 700; font-size: 14px; padding: 10px 0; border-radius: 8px; cursor: pointer; transition: 0.2s; }
.seg button.on { background: var(--card); color: var(--ink); font-weight: 800; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

.pill { display: inline-block; border-radius: 99px; padding: 5px 12px; font-size: 11.5px; font-weight: 800; text-transform: uppercase; }
.lo { background: rgba(34, 197, 94, 0.12); color: #16a34a; border: 1px solid rgba(34, 197, 94, 0.25); }
.mi { background: rgba(234, 179, 8, 0.12); color: #ca8a04; border: 1px solid rgba(234, 179, 8, 0.25); }
.hi { background: rgba(239, 68, 68, 0.12); color: #dc2626; border: 1px solid rgba(239, 68, 68, 0.25); }
.gy { background: var(--bg); color: var(--mut); border: 1px solid var(--line); }

.btn {
  background: var(--accent); color: #fff; border: 0; padding: 12px 24px;
  border-radius: 99px; font-family: inherit; font-weight: 800; cursor: pointer;
  box-shadow: 0 4px 14px var(--accent-soft); transition: 0.2s;
}
.btn:hover { opacity: 0.92; transform: translateY(-1px); }
.btn.go { background: linear-gradient(135deg, var(--accent), #0284c7); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

table { width: 100%; border-collapse: collapse; margin-top: 16px; }
th, td { text-align: right; padding: 16px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--mut); font-size: 12px; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
tr.hl td { background: var(--accent-soft); color: var(--accent); font-weight: 800; }
.tw { overflow-x: auto; }

.imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.imgs img { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; object-fit: cover; height: 180px; }
.ev { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 18px; margin: 14px 0; }
blockquote { margin: 10px 0; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--card); border-radius: 8px; font-size: 13.5px; }

.path { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 16px 18px; margin: 12px 0; }
.path span.t { background: var(--card); color: var(--accent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 12.5px; }
.path b.r { margin-left: auto; text-align: right; }

.tag { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--line); border-radius: 99px; padding: 5px 14px; font-weight: 800; font-size: 11.5px; }
.ai { display: flex; gap: 12px; align-items: center; background: var(--accent-soft); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 14px; padding: 18px; margin-bottom: 20px; font-weight: 700; }

.bar { height: 12px; border-radius: 99px; display: flex; overflow: hidden; margin: 18px 0; background: var(--bg); border: 1px solid var(--line); }
.err { color: #dc2626; background: rgba(239, 68, 68, 0.1); padding: 14px; border-radius: 12px; font-weight: 700; margin: 14px 0; }

.tgl {
  position: fixed; right: 24px; bottom: 24px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 50%; width: 50px; height: 50px; display: grid; place-items: center; box-shadow: var(--shadow); cursor: pointer; font-size: 20px; z-index: 100; transition: 0.2s;
}
.tgl:hover { transform: scale(1.05); }
.note { text-align: center; color: var(--mut); font-size: 13px; line-height: 1.7; margin: 24px auto; max-width: 750px; }
.blk { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 32px; margin: 20px 0; box-shadow: var(--shadow); }
.blk .k { color: var(--mut); }
</style>
</head>
<body>

<div class="w">
  <div class="header-bar">
    <div>
      <h1>AIDC 生態保費試算系統</h1>
      <p>把生態風險，變成看得懂的保費（Flask 安全後端版）</p>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn" style="background:var(--bg); color:var(--ink); border:1px solid var(--line); box-shadow:none;" id="expJ">匯出 JSON</button>
      <button class="btn" style="background:var(--bg); color:var(--ink); border:1px solid var(--line); box-shadow:none;" id="expC">匯出 CSV</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="g g4" id="sum" style="margin-bottom: 24px;"></div>

  <p class="note"><b style="color:var(--ink)">模擬情境。</b>以虛擬 AIDC 基地示範；分數、費率與成本皆為假設，並非業界報價或精算結果。AI 請求統一經由 Flask 後端代理呼叫 Gemini API，確保金鑰隱私安全。</p>

  <div id="pane"></div>
</div>

<button class="tgl" id="tgl" title="切換深淺色">◐</button>

<script>
const $=s=>document.querySelector(s);
const IND=[
{k:'h',n:'棲地敏感性',w:30,c:'#22c55e',i:'🍃',L:['人工化基地且未辨識敏感棲地','一般綠地','鄰接自然水域或半自然棲地','影響範圍涉及重要棲地','涉及保護區 or 保育物種重要棲地'],r:'棲地'},
{k:'v',n:'植被移除比例',w:25,c:'#10b981',i:'🌳',L:['低於 10%','10% 至未滿 25%','25% 至未滿 50%','50% 至 75%','高於 75%'],r:'植被'},
{k:'r',n:'逕流與透水影響',w:15,c:'#3b82f6',i:'💧',L:['透水及逕流控制完善並有紀錄','有控制設施但成效待驗證','局部積水或控制不完整','缺乏必要控制','已記錄泥沙外流或水體受損'],r:'逕流'},
{k:'t',n:'冷卻排熱影響',w:15,c:'#f97316',i:'🌡',L:['無直接熱水排放且有紀錄','有降溫並持續監測','排放溫差或影響待確認','有異常升溫紀錄','有升溫及生態損害證據'],r:'排熱'},
{k:'m',n:'監測與治理',w:10,c:'#64748b',i:'📈',L:['定期監測、可追溯並持續改善','定期監測但紀錄不完整','不定期監測','缺乏系統且異常未改善','重大異常未處理或無法追溯'],r:'監測'},
{k:'n',n:'夜間施工干擾',w:5,c:'#8b5cf6',i:'🌙',L:['0%','大於 0% 至 10%','大於 10% 至 30%','大於 30% 至 50%','50% 以上'],r:'夜間'}];

const CL=[['損失超過上限',300,250,30,200,80],['損失低於自負額',40,25,30,200,80],['部分保障、自留足夠',150,120,30,200,80]];
const S={tab:0,sc:{b:{h:3,v:3,r:3,t:3,m:2,n:3},a:{h:2,v:2,r:3,t:2,m:1,n:2}},soc:{b:70,a:85},gov:{b:70,a:90},L:200,rate:1,cl:0,
ins:{C:300,E:250,D:30,L:200,R:80},rs:{ad:4200,ap:5000,al:452,pl:500,md:11,mp:12},path:'b',own:'',due:'',rev:'',doc:'',docStage:'a',docRes:null,log:[],img:{b:null,a:null},imgDates:{b:'',a:''},roi:{x:0,y:0,w:100,h:100},demoN:0,isDemo:true,imgRes:null,plain:'',tnfd:'',busy:'',err:''};

const f=(n,d=2)=>Number(n).toFixed(d);
const calcS=sc=>100*IND.reduce((s,x)=>s+x.w/100*(sc[x.k]-1)/4,0);
const realLvl=(s,sc)=>(Object.values(sc).includes(5)||s>=60)?'高':s<30?'低':s<60?'中':'高';
const mult=(q,hi)=>hi?1.6:q>=80?1:q>=60?1.3:1.6;
const Qf=(s,so,go)=>.5*(100-s)+.2*so+.3*go;
function prem(st){const sc=S.sc[st],s=calcS(sc),hi=realLvl(s,sc)==='高',q=Qf(s,S.soc[st],S.gov[st]),m=mult(q,hi);return{s,q,m,p:S.L*S.rate/100*m,hi,lv:realLvl(s,sc)}}
function claim(x){const I=Math.min(Math.max(x.E-x.D,0),x.L),U=x.C-I,G=Math.max(U-x.R,0);return{I,U,G,cov:U?x.R/U*100:100}}
const pc=l=>l==='低'?'lo':l==='中'?'mi':'hi';
const wan=n=>f(n,1)+'<small> 萬</small>';

function gauge(s,col){const p=Math.min(s,100)/100,a=Math.PI*(1-p),x=100+80*Math.cos(a),y=100-80*Math.sin(a);
return`<svg viewBox="0 0 200 118" width="100%" style="max-width:220px"><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="var(--line)" stroke-width="14" stroke-linecap="round"/><path d="M20 100A80 80 0 0 1 ${x} ${y}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round"/><text x="100" y="104" text-anchor="middle" fill="var(--ink)" font-size="34" font-weight="800">${f(s)}</text></svg>`}

function radar(){const cx=170,cy=150,R=115,n=6,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+R*v*Math.cos(a),cy+R*v*Math.sin(a)]};
const poly=st=>IND.map((x,i)=>pt(i,S.sc[st][x.k]/5).join(',')).join(' ');
let g=[.2,.4,.6,.8,1].map(v=>`<polygon points="${IND.map((_,i)=>pt(i,v).join(' ')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('');
g+=IND.map((x,i)=>{const[a,b]=pt(i,1.25);return`<text x="${a}" y="${b+4}" text-anchor="middle" fill="var(--mut)" font-size="13" font-weight="700">${x.r}</text>`}).join('');
return`<svg viewBox="0 0 340 310" width="100%" style="max-width:380px;display:block;margin:auto">${g}<polygon points="${poly('b')}" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316" stroke-width="2.5"/><polygon points="${poly('a')}" fill="rgba(2, 132, 199, 0.15)" stroke="#0284c7" stroke-width="2.5"/></svg>`}

function ringSvg(p,col){const r=40,c=2*Math.PI*r,v=Math.min(Math.max(p,0),100)/100;return`<svg class="ring" viewBox="0 0 96 96" style="width:68px;height:68px;"><circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="48" cy="48" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 48 48)"/></svg>`}
const light=(v,g,y)=>v>=g?['綠燈','#22c55e','lo']:v>=y?['黃燈','#f59e0b','mi']:['紅燈','#ef4444','hi'];

function summary(){const b=prem('b'),a=prem('a'),cl=claim(S.ins);
$('#sum').innerHTML=`<div class="c"><div class="k"><i class="tag" style="padding:2px 8px;margin-right:4px">前</i>施工前生態 S</div><div class="big">${f(b.s)}</div><div class="k" style="margin-top:6px"><span class="pill ${pc(b.lv)}">${b.lv}風險</span></div></div>
<div class="c"><div class="k"><i class="tag" style="padding:2px 8px;margin-right:4px;background:var(--accent-soft);color:var(--accent)">後</i>施工後生態 S</div><div class="big">${f(a.s)}</div><div class="k" style="margin-top:6px"><span class="pill ${pc(a.lv)}">${a.lv}風險</span></div></div>
<div class="c"><div class="k">施工後假設年保費</div><div class="big">${wan(a.p)}</div><div class="k" style="margin-top:6px">${b.p>=a.p?'比施工前少 '+f(b.p-a.p,1)+' 萬':'比施工前多 '+f(a.p-b.p,1)+' 萬'}</div></div>
<div class="c"><div class="k">資金缺口 G</div><div class="big">${wan(cl.G)}</div><div class="k" style="margin-top:6px">${cl.G>0?'<span class="pill hi">自留資金不足</span>':'<span class="pill lo">目前無缺口</span>'}</div></div>`}

function tabs(){
  const names = ['核心評估', '保費試算', '理賠防護', '復育監控', 'AI 智慧查核'];
  $('#tabs').innerHTML = names.map((t,i)=>`<button class="${S.tab===i?'on':''}" onclick="S.tab=${i};draw()">${t}</button>`).join('');
}

function seg(st,k){return`<div class="seg">${[1,2,3,4,5].map(v=>`<button class="${S.sc[st][k]===v?'on':''}" onclick="S.sc.${st}.${k}=${v};draw()">${v}</button>`).join('')}</div>`}

function num(o,k,min=0,max=1e9){return`<input type="number" value="${o[k]}" min="${min}" max="${max}" step="any" data-o="${o===S.ins?'ins':o===S.rs?'rs':o===S.soc?'soc':o===S.gov?'gov':'S'}" data-k="${k}">`}

// 0: 核心評估
function pAssess(){
  const b=prem('b'),a=prem('a');
  let h=`<h2>六個指標，一眼看懂風險</h2><p class="note" style="margin-top:0">依 TNFD LEAP 自訂的初步篩選表。點選 1–5 分調整指標。</p>
  <div class="blk">
    <div class="row"><div class="k">生態風險分數儀表板</div>${(b.hi || a.hi)?'<span class="pill hi">⚠️ 偵測到高風險升級</span>':''}</div>
    <div class="g g2" style="grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:10px;margin-top:12px">
      <div>${gauge(b.s,'#f97316')}<div>施工前</div><span class="pill ${pc(b.lv)}" style="margin-top:8px">${b.lv}風險</span></div>
      <div><div class="k" style="justify-content:center">變化</div><div class="big">${a.s-b.s>0?'+':'−'}${f(Math.abs(a.s-b.s))}</div><span class="pill gy">${b.lv} → ${a.lv}</span></div>
      <div>${gauge(a.s,'#38bdf8')}<div>施工後</div><span class="pill ${pc(a.lv)}" style="margin-top:8px">${a.lv}風險</span></div>
    </div>
  </div>
  <div class="g g2">`;
  IND.forEach(x=>{const cb=x.w*(S.sc.b[x.k]-1)/4,ca=x.w*(S.sc.a[x.k]-1)/4,d=cb-ca;
  h+=`<div class="c"><div class="row"><div class="row" style="gap:12px"><div style="background:${x.c};color:#fff;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:16px">${x.i}</div><div><div style="font-weight:800;font-size:15px">${x.n}</div><div class="k">權重 ${x.w}%</div></div></div><span class="pill gy">1–5 分</span></div>
  <div style="margin-top:14px"><b>施工前評分</b>：${S.sc.b[x.k]} 分</div>${seg('b',x.k)}<div class="k" style="margin-bottom:10px">${x.L[S.sc.b[x.k]-1]}</div>
  <div><b>施工後評分</b>：${S.sc.a[x.k]} 分</div>${seg('a',x.k)}<div class="k" style="margin-bottom:10px">${x.L[S.sc.a[x.k]-1]}</div>
  <div class="foot" style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:10px"><span class="k">加權貢獻：<b style="color:var(--ink)">${f(cb)} → ${f(ca)}</b></span><span class="pill ${d>0?'lo':d<0?'hi':'gy'}">${d>0?'↓ '+f(d):d<0?'↑ '+f(-d):'持平'}</span></div></div>`});
  h+=`</div><div class="g g2" style="margin-top:20px"><div class="c"><div class="k">風險輪廓雷達圖</div><h3 style="margin:4px 0 14px;font-size:18px">施工前後面向對比</h3>${radar()}<div class="k" style="justify-content:center;gap:16px;display:flex;margin-top:10px"><span><i class="tag" style="background:#f97316;padding:2px 6px"></i> 施工前</span><span><i class="tag" style="background:#0284c7;padding:2px 6px"></i> 施工後</span></div></div>
  <div class="c"><div class="k">加權貢獻分析</div><h3 style="margin:4px 0 14px;font-size:18px">各指標變動幅度</h3>`;
  IND.map(x=>({x,d:x.w*(S.sc.b[x.k]-S.sc.a[x.k])/4})).sort((p,q)=>q.d-p.d).forEach(({x,d})=>{const pa=x.w*(S.sc.a[x.k]-1)/4;
  h+=`<div class="row" style="margin:12px 0"><div style="width:110px;font-weight:700">${x.n}</div><div style="flex:1;background:var(--bg);height:8px;border-radius:99px;overflow:hidden;border:1px solid var(--line)"><div style="height:100%;background:var(--accent);width:${pa/30*100}%"></div></div><b style="width:50px;text-align:right;color:${d>0?'#16a34a':d<0?'#dc2626':'var(--mut)'}">${d>0?'−':d<0?'+':'±'}${f(Math.abs(d))}</b></div>`});
  return h+`</div></div>`;
}

// 1: 保費試算
function pPrem(){

const clampPct=v=>{if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(v);return Number.isFinite(n)?Math.min(100,Math.max(0,n)):null};
const removalPct=(before,after)=>{if(before===null||before===undefined||after===null||after===undefined)return null;const b=Number(before),a=Number(after);if(!Number.isFinite(b)||!Number.isFinite(a)||b<=0)return null;return (b-a)/b*100};
const pctScore=p=>{const v=clampPct(p);return v==null?null:v<10?1:v<25?2:v<50?3:v<=75?4:5};

function search(st){const cur={...S.sc[st]},s0=calcS(cur),h0=realLvl(s0,cur)==='高',q0=Qf(s0,S.soc[st],S.gov[st]),m0=mult(q0,h0);if(m0===1)return{m0,res:[]};
const ks=IND.map(x=>x.k),out=[];(function rec(i,sc,ch){if(i===6){if(!ch)return;const s=calcS(sc),hi=realLvl(sc)==='高',m=mult(Qf(s,S.soc[st],S.gov[st]),hi);if(m<m0)out.push({sc:{...sc},ch,s,q:Qf(s,S.soc[st],S.gov[st]),m});return}
const k=ks[i];for(let v=1;v<=cur[k];v++){sc[k]=v;rec(i+1,sc,ch+(v<cur[k]?1:0))}sc[k]=cur[k]})(0,{...cur},0);
out.sort((a,b)=>a.ch-b.ch||b.m-a.m||a.s-b.s);const mn=out.length?out[0].ch:0;
return{m0,q0,res:out.filter(o=>o.ch===mn).sort((a,b)=>a.m-b.m||a.s-b.s).slice(0,3)}}

async function callGemini(prompt, imageBase64List = [], jsonMode = false) {
  const response = await fetch('https://ai-backend-hkff.onrender.com/api/gemini', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt: prompt, images: imageBase64List, json_mode: jsonMode })
  });
  const result = await response.json();
  if (!response.ok || !result.success) throw new Error(result.error || `Flask 後端請求失敗 (${response.status})`);
  return result.data;
}

const rub=IND.map(x=>x.k+' '+x.n+'：'+x.L.map((l,i)=>(i+1)+'='+l).join('；')).join('\n');
const nz=t=>String(t||'').replace(/\s+/g,'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]));
const DOC0='2026/03/02 施工日誌：基地鄰接既有溪流，已設置 30 公尺緩衝帶。累計清除植被約 12%（約 0.6 公頃／原有 5 公頃）。\n2026/03/09 設置透水鋪面與滯洪池，雨後局部仍有積水，排水控制尚未完整。\n2026/03/16 冷卻系統改採閉路循環，並持續監測排水溫度，每月出具報告。\n2026/03/23 夜間施工 4 天／總施工 60 天，約 7%。\n2026/03/30 每月定期監測並建立可追溯紀錄，上月異常已改善。';

async function ai(key,fn){ S.busy=key; S.err=''; draw(); try{ await fn(); } catch(e){ S.err='後端 API 錯誤：'+((e&&e.message)||e); } S.busy=''; draw(); }

function docRun(){return ai('doc',async()=>{
  if(!S.doc.trim())throw{message:'請先貼上文件內容'};
  const prompt='你是生態風險查核助理。依下列評分表，從文件擷取證據並建議各指標分數。只回傳 JSON 陣列，每筆格式 {"k":"指標代碼","score":1到5整數,"quote":"從文件逐字複製的原文，不可改寫或合併","reason":"一句話理由"}。文件中找不到證據的指標不要列出。\n評分表：\n'+rub+'\n文件：\n'+S.doc;
  const r=await callGemini(prompt,[],true);
  const a=Array.isArray(r)?r:(r.items||[]);
  S.docRes=a.filter(it=>IND.some(x=>x.k===it.k)).map(it=>({...it,score:Math.min(5,Math.max(1,Math.round(it.score))),ok:!!nz(it.quote)&&nz(S.doc).includes(nz(it.quote))}));
})}

function adopt(i){const it=S.docRes[i];S.sc[S.docStage][it.k]=it.score;it.done=true;S.log.push({t:new Date().toLocaleString('zh-TW'),stage:S.docStage==='b'?'施工前':'施工後',k:IND.find(x=>x.k===it.k).n,score:it.score,quote:it.quote});draw()}
function upTxt(inp){const f=inp.files[0];if(f)f.text().then(t=>{S.doc=t;S.docRes=null;draw()})}

function mk(seed,k){let s=seed;const R=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
const c=document.createElement('canvas');c.width=400;c.height=300;const g=c.getContext('2d');
g.fillStyle='#6f8f4a';g.fillRect(0,0,400,300);
for(let i=0;i<260;i++){g.fillStyle='hsl('+(85+R()*45)+','+(40+R()*30)+'%,'+(22+R()*28)+'%)';g.beginPath();g.arc(R()*400,R()*300,8+R()*22,0,7);g.fill()}
g.fillStyle='#5b7fa8';g.beginPath();g.ellipse(340,60,40,28,0,0,7);g.fill();g.fillStyle='#9a958c';g.fillRect(0,250,150,50);
const b=c.toDataURL('image/jpeg',.85);
g.fillStyle='#c2a67f';g.fillRect(110,40,260*k,190*k);g.fillStyle='#d8d6d0';g.fillRect(130,60,120*k,70*k);
return [b,c.toDataURL('image/jpeg',.85)];
}

const gr=u=>new Promise(res=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');const sw=i.naturalWidth||i.width,sh=i.naturalHeight||i.height;const rx=Math.max(0,Math.min(99.9,Number(S.roi.x)||0))/100,ry=Math.max(0,Math.min(99.9,Number(S.roi.y)||0))/100,rw=Math.max(1,Math.min(100-rx*100,Number(S.roi.w)||100))/100,rh=Math.max(1,Math.min(100-ry*100,Number(S.roi.h)||100))/100;const sx=sw*rx,sy=sh*ry,cw=sw*rw,ch=sh*rh;c.width=200;c.height=Math.max(1,Math.round(200*ch/cw));const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(i,sx,sy,cw,ch,0,0,c.width,c.height);const d=g.getImageData(0,0,c.width,c.height).data;let n=0,t=0;for(let q=0;q<d.length;q+=4){if(d[q+3]===0)continue;t++;const r=d[q]/255,G=d[q+1]/255,b=d[q+2]/255,mx=Math.max(r,G,b),mn=Math.min(r,G,b),delta=mx-mn;let hue=0;if(delta){if(mx===G)hue=60*(((b-r)/delta)+2);else if(mx===r)hue=60*(((G-b)/delta)%6);else hue=60*(((r-G)/delta)+4)}if(hue<0)hue+=360;const sat=mx===0?0:delta/mx,val=mx;if(hue>=65&&hue<=170&&sat>=0.18&&val>=0.12)n++}res(t>0?n/t*100:null)};i.onerror=()=>res(null);i.src=u});

async function pix(){if(S.img.b&&S.img.a){S.img.gb=await gr(S.img.b);S.img.ga=await gr(S.img.a);draw()}}
function applyRoi(){const get=id=>Math.max(0,Math.min(100,Number(document.getElementById(id).value)||0));let x=get('roiX'),y=get('roiY'),w=get('roiW'),h=get('roiH');w=Math.max(1,Math.min(w,100-x));h=Math.max(1,Math.min(h,100-y));S.roi={x,y,w,h};pix()}

function setDemo(){
  S.demoN++;
  const [b,a]=mk(7+S.demoN*13,.6+(S.demoN%3)*.15);
  S.img={b,a}; S.isDemo=true; S.imgRes=null; pix();
}

function up(w,inp){
  const f=inp.files[0];if(!f)return;
  const i=new Image();i.onload=()=>{
    const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');
    c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);
    if(S.isDemo){S.img={b:null,a:null};S.isDemo=false}
    S.img[w]=c.toDataURL('image/jpeg',.85);S.imgRes=null;pix();draw()
  };i.src=URL.createObjectURL(f)
}

function imgRun(){return ai('img',async()=>{
  if(!S.img.b||!S.img.a)throw{message:'請先提供施工前與施工後影像'};
  const prompt='請先確認是否為同一基地、同一範圍及相近視角，再比較可辨識的植被覆蓋變化。不要把屋頂、人工綠色物件或陰影直接當植被；若影像不一致或無法判斷，請在 note 說明不確定，不要猜測。removal_pct 定義為(施工前植被面積-施工後植被面積)/施工前植被面積*100；若施工後反而較多，允許回傳負數，不能強制改成 0。只回傳 JSON：{"removal_pct":-100到100的數字或 null,"note":"說明依據與限制"}';
  S.imgRes=await callGemini(prompt,[S.img.b,S.img.a],true);
})}

function planRun(){return ai('plan',async()=>{
  const sr=search(S.path);if(!sr.res.length)throw{message:'目前沒有可說明的改善路徑'};
  const t=sr.res.map((r,i)=>'路徑'+(i+1)+'：'+IND.filter(x=>r.sc[x.k]!==S.sc[S.path][x.k]).map(x=>x.n+' '+S.sc[S.path][x.k]+'→'+r.sc[x.k]).join('、')+'；倍數 '+r.m+'×').join('\n');
  const prompt='請下列由公式算出的改善路徑，翻成施工現場主管看得懂的白話建議，繁體中文，150 字內，不要更動任何數字或項目，不要自行加入新的路徑。\n'+t;
  S.plain=await callGemini(prompt,[],false);
})}

function tnfdRun(){return ai('tnfd',async()=>{
  const b=prem('b'),a=prem('a');
  const t='施工前 S='+f(b.s)+'、施工後 S='+f(a.s)+'；各指標（施工前→施工後）：'+IND.map(x=>x.n+' '+S.sc.b[x.k]+'→'+S.sc.a[x.k]).join('、')+'；施工後風險等級：'+a.lv;
  const prompt='依 TNFD 的 LEAP 四步驟（Locate 定位、Evaluate 評估、Assess 衡量、Prepare 準備），以繁體中文為虛擬 AIDC 基地草擬一段自然風險揭露文字，約 300 字，分四小段。只能使用下列資料，不可捏造其他數據，缺資料處註明「待補」，結尾註明「草稿，須人工覆核」。\n'+t;
  S.tnfd=await callGemini(prompt,[],false);
})}

function setCl(i){S.cl=i;const c=CL[i];Object.assign(S.ins,{C:c[1],E:c[2],D:c[3],L:c[4],R:c[5]});draw()}

function draw(){
  tabs(); summary();
  const pages = [pAssess, pPrem, pClaim, pRest, pAudit2];
  const renderFn = pages[S.tab] || pAssess;
  $('#pane').innerHTML = renderFn();
  
  document.querySelectorAll('#pane input').forEach(e=>e.addEventListener('change',()=>{
    const o={ins:S.ins,rs:S.rs,soc:S.soc,gov:S.gov,S:S}[e.dataset.o];
    if(o)o[e.dataset.k]=e.type==='number'?Math.max(0,Number(e.value)||0):e.value;
    if(e.dataset.o==='ins')S.cl=-1;
    if(e.dataset.o==='S'&&e.dataset.k==='L')S.ins.L=S.L;
    draw();
  }));
}

function dl(t,n,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
$('#expJ').onclick=()=>dl(JSON.stringify({state:S,before:prem('b'),after:prem('a'),claim:claim(S.ins)},null,2),'aidc.json','application/json');
$('#expC').onclick=()=>{const b=prem('b'),a=prem('a'),c=claim(S.ins);
dl('\uFEFF階段,S,Q,倍數,年保費(萬)\n施工前,'+f(b.s)+','+f(b.q)+','+b.m+','+f(b.p)+'\n施工後,'+f(a.s)+','+f(a.q)+','+a.m+','+f(a.p)+'\n保險給付I,'+c.I+',U,'+c.U+',G,'+c.G,'aidc.csv','text/csv;charset=utf-8')};
$('#tgl').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark';r.dataset.theme=d?'':'dark';};

draw(); setDemo();
</script>
