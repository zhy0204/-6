<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>AIDC 生態保費試算 (前端直連版)</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 20px; background: #f9f9f9; }
        textarea { width: 100%; height: 120px; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background: #0066cc; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #004d99; }
        .result { margin-top: 15px; padding: 15px; background: #fff; border: 1px solid #ccc; white-space: pre-wrap; border-radius: 4px; }
        .status { padding: 8px; background: #e7f4e8; border: 1px solid #d4edda; margin-bottom: 15px; border-radius: 4px; color: #155724; font-size: 14px; }
    </style>
</head>
<body>

    <h1>AIDC 生態保費試算系統</h1>
    <p>把生態風險，變成看得懂的保費（前端直連穩定版）。</p>

    <div class="status" id="statusBox">
        ✨ 系統就緒：已改用前端直接連線 Gemini AI，不再依賴失效的後端伺服器。
    </div>

    <div class="card">
        <h3>① 佐證文件判讀 (Gemini AI)</h3>
        <p>從施工日誌找出證據，提出建議與佐證文字。</p>
        <textarea id="logInput" placeholder="請在此貼上施工日誌或監測報告內容..."></textarea>
        <button onclick="runGeminiAI()">開始 Gemini AI 判讀</button>
        <div id="aiResult" class="result" style="display:none;"></div>
    </div>

    <!-- 請在此處填入你剛剛複製的 Gemini API 金鑰 -->
    <script>
        const GEMINI_API_KEY = "請貼上你的Gemini_API_Key";

        async function runGeminiAI() {
            const promptText = document.getElementById('logInput').value.trim();
            const resultDiv = document.getElementById('aiResult');

            if (!GEMINI_API_KEY || GEMINI_API_KEY.includes("請貼上")) {
                alert('請先在程式碼中的 GEMINI_API_KEY 填入你的金鑰！');
                return;
            }
            if (!promptText) {
                alert('請先輸入要判讀的施工日誌內容！');
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerText = 'AI 正在分析中，請稍候...';

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `請根據以下施工日誌內容，萃取關鍵數據並提出生態評估建議：\n\n${promptText}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    resultDiv.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    resultDiv.innerText = '回傳格式錯誤或金鑰無效：\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.innerText = '連線錯誤：' + error.message;
            }
        }
    </script>

</body>
</html>
