<!DOCTYPE html>
<html lang="zh-Hant" data-theme="cyber">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIDC 生態保費試算 - 智慧戰情室</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 💎 頂級 SaaS 質感美學變數 */
:root[data-theme="cyber"] {
  --bg: #090a0f;
  --card: #121622;
  --card-hover: #181d2e;
  --ink: #f8fafc;
  --mut: #94a3b8;
  --line: rgba(255, 255, 255, 0.07);
  --accent: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.2);
  --radius: 16px;
  --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
}
:root[data-theme="minimal"] {
  --bg: #fafafa;
  --card: #ffffff;
  --card-hover: #f4f4f5;
  --ink: #09090b;
  --mut: #71717a;
  --line: #e4e4e7;
  --accent: #0284c7;
  --accent-glow: rgba(2, 132, 199, 0.1);
  --radius: 16px;
  --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
}
:root[data-theme="emerald"] {
  --bg: #041410;
  --card: #09261f;
  --card-hover: #0e372e;
  --ink: #ecfdf5;
  --mut: #6ee7b7;
  --line: rgba(52, 211, 153, 0.15);
  --accent: #10b981;
  --accent-glow: rgba(16, 185, 129, 0.25);
  --radius: 16px;
  --shadow: 0 10px 30px -10px rgba(4, 20, 16, 0.8);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
  font-size: 14.5px; line-height: 1.6;
  transition: background 0.3s ease, color 0.3s ease;
}

.container { max-width: 1200px; margin: auto; padding: 36px 24px 80px; }

/* 🌟 頂部精緻導覽列 */
.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px; flex-wrap: wrap; gap: 16px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 28px; box-shadow: var(--shadow);
}
.brand-info h1 { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: -0.3px; }
.brand-info p { color: var(--mut); margin: 0; font-size: 12px; font-weight: 500; }

.theme-select-wrapper { display: flex; align-items: center; gap: 8px; }
.theme-select-wrapper span { font-size: 12px; font-weight: 700; color: var(--mut); }
select.theme-dropdown {
  background: var(--bg); border: 1px solid var(--line); color: var(--ink);
  padding: 8px 14px; border-radius: 10px; font-family: inherit; font-size: 12px; font-weight: 700;
  cursor: pointer; outline: none; transition: 0.2s;
}
select.theme-dropdown:hover { border-color: var(--accent); }

/* 🌟 英雄大橫幅 */
.hero-banner {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 32px 36px; margin-bottom: 24px; box-shadow: var(--shadow);
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;
}
.hero-banner h2 { font-size: clamp(22px, 3vw, 30px); margin: 0 0 4px; font-weight: 800; letter-spacing: -0.5px; }
.hero-banner p { color: var(--mut); margin: 0; font-size: 13.5px; font-weight: 500; }

/* 🌟 圓角現代分頁按鈕群 */
.nav-tabs {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 24px;
}
@media(max-width: 768px) { .nav-tabs { grid-template-columns: repeat(3, 1fr); } }
.nav-tabs button {
  background: var(--card); border: 1px solid var(--line); color: var(--mut);
  padding: 14px 10px; border-radius: 12px; font-family: inherit; font-weight: 700; font-size: 13.5px;
  cursor: pointer; transition: 0.2s; text-align: center; box-shadow: var(--shadow);
}
.nav-tabs button:hover { border-color: var(--accent); color: var(--ink); }
.nav-tabs button.on {
  background: var(--accent); color: var(--bg); border-color: var(--accent);
  box-shadow: 0 0 20px var(--accent-glow); font-weight: 800;
}

/* 🌟 4 大指標卡片 */
.grid-stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px;
}
@media(max-width: 900px) { .grid-stats { grid-template-columns: 1fr 1fr; } }
@media(max-width: 480px) { .grid-stats { grid-template-columns: 1fr; } }

.stat-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 24px; box-shadow: var(--shadow); transition: 0.2s;
}
.stat-card:hover { border-color: var(--accent); }
.stat-label { color: var(--mut); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
.stat-value { font-size: 28px; font-weight: 800; margin: 8px 0 2px; letter-spacing: -0.5px; }
.stat-desc { color: var(--mut); font-size: 12px; font-weight: 600; }

/* 主內容面板 */
.main-pane {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 32px; box-shadow: var(--shadow); margin-bottom: 24px;
}
.main-pane h2 { font-size: 20px; margin-top: 0; font-weight: 800; letter-spacing: -0.3px; }

.g { display: grid; gap: 14px; }
.g2 { grid-template-columns: 1fr 1fr; }
@media(max-width: 768px) { .g2 { grid-template-columns: 1fr; } }

.c {
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 20px;
}
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.in { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
.in:last-child { border: 0; }

input[type=number], input[type=text], textarea {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; color: var(--accent); font-family: inherit; font-weight: 700; width: 100px; text-align: right; outline: none;
}
textarea { width: 100%; text-align: left; color: var(--ink); font-weight: 400; min-height: 120px; resize: vertical; }

.seg { display: flex; background: var(--card); border-radius: 10px; padding: 3px; border: 1px solid var(--line); margin: 10px 0; }
.seg button { flex: 1; border: 0; background: none; color: var(--mut); font: inherit; font-weight: 700; font-size: 13px; padding: 8px 0; border-radius: 7px; cursor: pointer; transition: 0.2s; }
.seg button.on { background: var(--accent); color: var(--bg); font-weight: 800; box-shadow: 0 0 10px var(--accent-glow); }

.pill { display: inline-block; border-radius: 99px; padding: 4px 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
.lo { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
.mi { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
.hi { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
.gy { background: var(--card); color: var(--mut); border: 1px solid var(--line); }

.btn {
  background: var(--accent); color: var(--bg); border: 0; padding: 12px 24px;
  border-radius: 99px; font-family: inherit; font-weight: 800; cursor: pointer;
  box-shadow: 0 4px 15px var(--accent-glow); transition: 0.2s;
}
.btn:hover { opacity: 0.95; transform: translateY(-1px); }

table { width: 100%; border-collapse: collapse; margin-top: 14px; }
th, td { text-align: right; padding: 14px 10px; border-bottom: 1px solid var(--line); font-weight: 600; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--mut); font-size: 11.5px; text-transform: uppercase; font-weight: 800; }
tr.hl td { background: var(--card); color: var(--accent); font-weight: 800; }
.tw { overflow-x: auto; }
</style>
</head>
<body>
<div class="container">
  <!-- 🎨 下拉選單風格切換器 -->
  <div class="top-bar">
    <div class="brand-info">
      <h1>AIDC 智慧生態戰情室</h1>
      <p>Next-Gen Ecological Risk & Insurance Analytics</p>
    </div>
    <div class="theme-select-wrapper">
      <span>🎨 佈景主題：</span>
      <select class="theme-dropdown" id="themeSelector" onchange="changeTheme(this.value)">
        <option value="cyber">極客科技黑 (Cyber)</option>
        <option value="minimal">簡約高質感白 (Minimal)</option>
        <option value="emerald">森態翡翠綠 (Emerald)</option>
      </select>
    </div>
  </div>

  <div class="hero-banner">
    <div>
      <h2>AIDC 生態保費試算系統</h2>
      <p>把生態風險，變成看得懂的保費（Flask 安全後端版）</p>
    </div>
    <div style="font-size:11.5px; color:var(--accent); background:var(--bg); border:1px solid var(--line); padding:6px 14px; border-radius:99px; font-weight:700;">
      🔒 後端 AI 代理通道運行中
    </div>
  </div>

  <div class="nav-tabs" id="tabs"></div>
  <div class="grid-stats" id="sum"></div>
  <div class="main-pane" id="pane"></div>

  <div style="display: flex; justify-content: center; gap: 12px; margin-top: 24px;">
    <button class="btn" style="background:var(--card); color:var(--ink); border:1px solid var(--line); box-shadow:none;" id="expJ">匯出 JSON</button>
    <button class="btn" style="background:var(--card); color:var(--ink); border:1px solid var(--line); box-shadow:none;" id="expC">匯出 CSV</button>
  </div>
</div>

<script>
function changeTheme(themeName) {
  document.documentElement.setAttribute('data-theme', themeName);
  localStorage.setItem('preferred_theme', themeName);
}
const savedTheme = localStorage.getItem('preferred_theme');
if(savedTheme) {
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('themeSelector').value = savedTheme;
}

const $=s=>document.querySelector(s);
const IND=[
{k:'h',n:'棲地敏感性',w:30,c:'#22c55e',i:'🍃',L:['人工化基地且未辨識敏感棲地','一般綠地','鄰接自然水域或半自然棲地','影響範圍涉及重要棲地','涉及保護區 or 保育物種重要棲地'],r:'棲地'},
{k:'v',n:'植被移除比例',w:25,c:'#10b981',i:'🌳',L:['低於 10%','10% 至未滿 25%','25% 至未滿 50%','50% 至 75%','高於 75%'],r:'植被'},
{k:'r',n:'逕流與透水影響',w:15,c:'#3b82f6',i:'💧',L:['透水及逕流控制完善並有紀錄','有控制設施但成效待驗證','局部積水或控制不完整','缺乏必要控制','已記錄泥沙外流或水體受損'],r:'逕流'},
{k:'t',n:'冷卻排熱影響',w:15,c:'#f97316',i:'🌡',L:['無直接熱水排放且有紀錄','有降溫並持續監測','排放溫差或影響待確認','有異常升溫紀錄','有升溫及生態損害證據'],r:'排熱'},
{k:'m',n:'監測與治理',w:10,c:'#71717a',i:'📈',L:['定期監測、可追溯並持續改善','定期監測但紀錄不完整','不定期監測','缺乏系統且異常未改善','重大異常未處理或無法追溯'],r:'監測'},
{k:'n',n:'夜間施工干擾',w:5,c:'#8b5cf6',i:'🌙',L:['0%','大於 0% 至 10%','大於 10% 至 30%','大於 30% 至 50%','大於 50%'],r:'夜間'}];

const S={tab:0,sc:{b:{h:3,v:3,r:3,t:3,m:2,n:3},a:{h:2,v:2,r:3,t:2,m:1,n:2}},soc:{b:70,a:85},gov:{b:70,a:90},L:200,rate:1,cl:0,
ins:{C:300,E:250,D:30,L:200,R:80},rs:{ad:4200,ap:5000,al:452,pl:500,md:11,mp:12},path:'b',doc:'',docStage:'a',docRes:null,plain:'',tnfd:'',busy:'',err:''};

const f=(n,d=2)=>Number(n).toFixed(d);
const calcS=sc=>100*IND.reduce((s,x)=>s+x.w/100*(sc[x.k]-1)/4,0);
const lvl=(s,sc)=>(Object.values(sc).includes(5)||s>=60)?'高':s<30?'低':'中';
const mult=(q,hi)=>hi?1.6:q>=80?1:q>=60?1.3:1.6;
const Qf=(s,so,go)=>.5*(100-s)+.2*so+.3*go;
function prem(st){const sc=S.sc[st],s=calcS(sc),hi=lvl(s,sc)==='高',q=Qf(s,S.soc[st],S.gov[st]),m=mult(q,hi);return{s,q,m,p:S.L*S.rate/100*m,hi,lv:lvl(s,sc)}}
function claim(x){const I=Math.min(Math.max(x.E-x.D,0),x.L),U=x.C-I,G=Math.max(U-x.R,0);return{I,U,G,cov:U?x.R/U*100:100}}
const wan=n=>f(n,1)+' 萬';

function summary(){
  const b=prem('b'),a=prem('a'),cl=claim(S.ins);
  $('#sum').innerHTML=`
    <div class="stat-card"><div class="stat-label"><span style="width:6px;height:6px;border-radius:50%;background:#f97316;display:inline-block"></span>施工前生態 S</div><div class="stat-value">${f(b.s)}</div><div class="stat-desc">${b.lv}風險</div></div>
    <div class="stat-card"><div class="stat-label"><span style="width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block"></span>施工後生態 S</div><div class="stat-value">${f(a.s)}</div><div class="stat-desc">${a.lv}風險</div></div>
    <div class="stat-card"><div class="stat-label">施工後年保費</div><div class="stat-value">${wan(a.p)}</div><div class="stat-desc">較前省 ${f(b.p-a.p,1)} 萬</div></div>
    <div class="stat-card"><div class="stat-label"><span style="width:6px;height:6px;border-radius:50%;background:#ef4444;display:inline-block"></span>資金缺口 G</div><div class="stat-value">${wan(cl.G)}</div><div class="stat-desc">${cl.G>0?'資金不足':'無缺口'}</div></div>
  `;
}

function tabs(){
  $('#tabs').innerHTML=['核心評估','保費試算','理賠防護','復育監控','AI 智慧查核'].map((t,i)=>`<button class="${S.tab===i?'on':''}" onclick="S.tab=${i};draw()">${t}</button>`).join('');
}

function seg(st,k){
  return `<div class="seg">${[1,2,3,4,5].map(v=>`<button class="${S.sc[st][k]===v?'on':''}" onclick="S.sc.${st}.${k}=${v};draw()">${v}</button>`).join('')}</div>`;
}

function pAssess(){
  const b=prem('b'),a=prem('a');
  let h=`<h2>六大指標動態評估</h2><p style="color:var(--mut);margin-bottom:16px;font-size:13.5px;">依 TNFD LEAP 架構評估。點選 1–5 分調整指標。</p><div class="g g2">`;
  IND.forEach(x=>{
    h+=`<div class="c">
      <div class="row"><b style="font-size:14px;">${x.i} ${x.n}</b><span class="pill gy">權重 ${x.w}%</span></div>
      <div style="margin-top:12px; font-size:12px; color:var(--mut)">施工前評分：${S.sc.b[x.k]} 分</div>${seg('b',x.k)}
      <div style="margin-top:12px; font-size:12px; color:var(--mut)">施工後評分：${S.sc.a[x.k]} 分</div>${seg('a',x.k)}
    </div>`;
  });
  return h+`</div>`;
}

function pPrem(){
  const b=prem('b'),a=prem('a'),sc3=prem('a');
  const rows=[['改善前',b.s,S.soc.b,S.gov.b,b.q,b.m,b.p],['只改善生態',a.s,S.soc.b,S.gov.b,Qf(a.s,S.soc.b,S.gov.b),mult(Qf(a.s,S.soc.b,S.gov.b),a.hi),S.L*S.rate/100*mult(Qf(a.s,S.soc.b,S.gov.b),a.hi)],['三構面皆改善',a.s,S.soc.a,S.gov.a,sc3.q,sc3.m,sc3.p]];
  return `<h2>ESG 綜合評分與保費試算</h2><div class="g g2">
    <div class="c">
      <div class="in">社會構面設定（施工前）${num(S.soc,'b',0,100)}</div>
      <div class="in">治理構面設定（施工前）${num(S.gov,'b',0,100)}</div>
      <div class="in">社會構面設定（施工後）${num(S.soc,'a',0,100)}</div>
      <div class="in">治理構面設定（施工後）${num(S.gov,'a',0,100)}</div>
    </div>
    <div class="c">
      <div class="in">保障上限 L（萬）${num(S,'L')}</div>
      <div class="in">基準費率（%）${num(S,'rate')}</div>
    </div>
  </div>
  <div class="c tw" style="margin-top:16px">
    <table><tr><th>情境方案</th><th>S / 社 / 治</th><th>Q 值</th><th>倍數</th><th>預估年保費</th></tr>
    ${rows.map((r,i)=>`<tr class="${i==1?'hl':''}"><td>${r[0]}</td><td>${f(r[1])}/${r[2]}/${r[3]}</td><td>${f(r[4])}</td><td>${f(r[5],1)}</td><td>${wan(r[6])}</td></tr>`).join('')}
    </table>
  </div>`;
}

function pClaim(){
  const x=S.ins,r=claim(x);
  return `<h2>損害發生與保險給付試算</h2><div class="g g2">
    <div class="c">
      <div class="in">總復育成本 C${num(x,'C')}</div>
      <div class="in">保險範圍損失 E${num(x,'E')}</div>
      <div class="in">自負額 D${num(x,'D')}</div>
      <div class="in">保障上限 L${num(x,'L')}</div>
      <div class="in">可動用自留 R${num(x,'R')}</div>
    </div>
    <div class="c">
      <div class="in">保險給付 I<b>${wan(r.I)}</b></div>
      <div class="in">自留支應<b>${wan(Math.min(r.U,x.R))}</b></div>
      <div class="in" style="color:#f87171">資金缺口 G<b>${wan(r.G)}</b></div>
      <div class="in">資金覆蓋率<b>${f(r.cov,1)}%</b></div>
    </div>
  </div>`;
}

function pRest(){
  return `<h2>生態復育進度與指標監控</h2><div class="c"><p style="color:var(--mut)">即時追蹤復育達成率、存活率與各項環境監測指標狀態。</p></div>`;
}

function pAudit2(){
  return `<h2>AI 智慧查核與決策輔助</h2><div class="c"><p style="color:var(--mut)">串接後端 AI 通道，提供日誌智能解析與 TNFD 風險揭露草擬。</p></div>`;
}

function num(o,k,min=0,max=1e9){return `<input type="number" value="${o[k]}" min="${min}" max="${max}" step="any" data-o="S" data-k="${k}">`}

function draw(){
  tabs();
  summary();
  $('#pane').innerHTML = [pAssess, pPrem, pClaim, pRest, pAudit2][S.tab]();
}

draw();
</script>
</body>
</html>
