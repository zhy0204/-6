<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIDC 生態保費試算 - 智慧戰情室</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090e;
  --card: #101522;
  --card-hover: #161f33;
  --ink: #f8fafc;
  --mut: #8a99ad;
  --line: rgba(255, 255, 255, 0.08);
  --accent: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.2);
  --radius: 16px;
  --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
  font-size: 14px; line-height: 1.6;
}

.app-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
}
@media(max-width: 900px) {
  .app-layout { grid-template-columns: 1fr; }
}

.sidebar {
  background: var(--card);
  border-right: 1px solid var(--line);
  padding: 32px 24px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
@media(max-width: 900px) {
  .sidebar { border-right: none; border-bottom: 1px solid var(--line); padding: 20px; }
}
.brand h2 { font-size: 17px; margin: 0 0 4px; font-weight: 800; letter-spacing: -0.3px; }
.brand p { color: var(--mut); margin: 0; font-size: 12px; }

.nav-menu { display: flex; flex-direction: column; gap: 8px; }
@media(max-width: 900px) { .nav-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; } }
.nav-menu button {
  background: transparent; border: 1px solid transparent; color: var(--mut);
  padding: 12px 16px; border-radius: 10px; font-family: inherit; font-weight: 700; font-size: 13.5px;
  text-align: left; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px;
}
.nav-menu button:hover { background: var(--card-hover); color: var(--ink); }
.nav-menu button.on {
  background: var(--accent); color: var(--bg); font-weight: 800;
  box-shadow: 0 0 20px var(--accent-glow); border-color: var(--accent);
}

.main-content {
  padding: 36px 40px;
  max-width: 1100px;
  width: 100%;
}
@media(max-width: 768px) { .main-content { padding: 20px; } }

.header-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px; flex-wrap: wrap; gap: 16px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 28px; box-shadow: var(--shadow);
}
.header-bar h1 { font-size: 20px; margin: 0 0 4px; font-weight: 800; }
.header-bar p { color: var(--mut); margin: 0; font-size: 13px; }

.metrics-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px;
}
@media(max-width: 1024px) { .metrics-grid { grid-template-columns: 1fr 1fr; } }
@media(max-width: 480px) { .metrics-grid { grid-template-columns: 1fr; } }

.metric-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow); transition: 0.2s;
}
.metric-card:hover { border-color: var(--accent); }
.m-title { color: var(--mut); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.m-value { font-size: 26px; font-weight: 800; margin: 8px 0 2px; letter-spacing: -0.5px; }
.m-desc { color: var(--mut); font-size: 12px; font-weight: 600; }

.pane-box {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 32px; box-shadow: var(--shadow); margin-bottom: 24px;
}
.pane-box h2 { font-size: 20px; margin-top: 0; font-weight: 800; }

.g { display: grid; gap: 14px; }
.g2 { grid-template-columns: 1fr 1fr; }
@media(max-width: 768px) { .g2 { grid-template-columns: 1fr; } }

.c {
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 20px;
}
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.in { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
.in:last-child { border: 0; }

input[type=number], input[type=text], textarea {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; color: var(--accent); font-family: inherit; font-weight: 700; width: 100px; text-align: right; outline: none;
}
textarea { width: 100%; text-align: left; color: var(--ink); font-weight: 400; min-height: 120px; resize: vertical; }

.seg { display: flex; background: var(--card); border-radius: 8px; padding: 3px; border: 1px solid var(--line); margin: 10px 0; }
.seg button { flex: 1; border: 0; background: none; color: var(--mut); font: inherit; font-weight: 700; font-size: 13px; padding: 8px 0; border-radius: 6px; cursor: pointer; transition: 0.2s; }
.seg button.on { background: var(--accent); color: var(--bg); font-weight: 800; box-shadow: 0 0 10px var(--accent-glow); }

.pill { display: inline-block; border-radius: 99px; padding: 4px 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
.lo { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
.mi { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
.hi { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
.gy { background: var(--card); color: var(--mut); border: 1px solid var(--line); }

.btn {
  background: var(--accent); color: var(--bg); border: 0; padding: 12px 24px;
  border-radius: 99px; font-family: inherit; font-weight: 800; cursor: pointer;
  box-shadow: 0 4px 15px var(--accent-glow); transition: 0.2s;
}
.btn:hover { opacity: 0.95; transform: translateY(-1px); }

table { width: 100%; border-collapse: collapse; margin-top: 14px; }
th, td { text-align: right; padding: 14px 10px; border-bottom: 1px solid var(--line); font-weight: 600; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--mut); font-size: 11.5px; text-transform: uppercase; font-weight: 800; }
tr.hl td { background: var(--card); color: var(--accent); font-weight: 800; }
.tw { overflow-x: auto; }
.imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
.imgs img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
.ev { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 16px; margin: 12px 0; }
.path { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 14px; margin: 10px 0; }
.path span.t { background: var(--card); color: var(--accent); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-weight: 700; font-size: 12px; }
.path b.r { margin-left: auto; text-align: right; }
.tag { background: var(--card); color: var(--accent); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; font-weight: 800; font-size: 11px; }
.ai { display: flex; gap: 12px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 16px; margin-bottom: 20px; font-weight: 700; }
.ring { position: relative; width: 80px; height: 80px; flex: none; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 0; }
.rem { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
.err { color: #f87171; font-size: 13px; margin: 10px 0; font-weight: 700; }
</style>
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <div class="brand">
      <h2>AIDC 智慧戰情室</h2>
      <p>Ecological Risk Analytics</p>
    </div>
    <nav class="nav-menu" id="tabs"></nav>
    <div style="margin-top:auto; font-size:11.5px; color:var(--mut); border-top:1px solid var(--line); padding-top:16px;">
      🔒 後端 AI 通道運行中
    </div>
  </aside>

  <main class="main-content">
    <div class="header-bar">
      <div>
        <h1>AIDC 生態保費試算系統</h1>
        <p>把生態風險，變成看得懂的保費（Flask 安全後端版）</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn" style="background:var(--card); color:var(--ink); border:1px solid var(--line); padding:8px 16px; font-size:12px; box-shadow:none;" id="expJ">匯出 JSON</button>
        <button class="btn" style="background:var(--card); color:var(--ink); border:1px solid var(--line); padding:8px 16px; font-size:12px; box-shadow:none;" id="expC">匯出 CSV</button>
      </div>
    </div>

    <div class="metrics-grid" id="sum"></div>
    <div class="pane-box" id="pane"></div>
  </main>
</div>

<script>
const $=s=>document.querySelector(s);
const IND=[
{k:'h',n:'棲地敏感性',w:30,c:'#22c55e',i:'🍃',L:['人工化基地且未辨識敏感棲地','一般綠地','鄰接自然水域或半自然棲地','影響範圍涉及重要棲地','涉及保護區 or 保育物種重要棲地'],r:'棲地'},
{k:'v',n:'植被移除比例',w:25,c:'#10b981',i:'🌳',L:['低於 10%','10% 至未滿 25%','25% 至未滿 50%','50% 至 75%','高於 75%'],r:'植被'},
{k:'r',n:'逕流與透水影響',w:15,c:'#3b82f6',i:'💧',L:['透水及逕流控制完善並有紀錄','有控制設施但成效待驗證','局部積水或控制不完整','缺乏必要控制','已記錄泥沙外流或水體受損'],r:'逕流'},
{k:'t',n:'冷卻排熱影響',w:15,c:'#f97316',i:'🌡',L:['無直接熱水排放且有紀錄','有降溫並持續監測','排放溫差或影響待確認','有異常升溫紀錄','有升溫及生態損害證據'],r:'排熱'},
{k:'m',n:'監測與治理',w:10,c:'#71717a',i:'📈',L:['定期監測、可追溯並持續改善','定期監測但紀錄不完整','不定期監測','缺乏系統且異常未改善','重大異常未處理或無法追溯'],r:'監測'},
{k:'n',n:'夜間施工干擾',w:5,c:'#8b5cf6',i:'🌙',L:['0%','大於 0% 至 10%','大於 10% 至 30%','大於 30% 至 50%','大於 50%'],r:'夜間'}];

const CL=[['損失超過上限',300,250,30,200,80],['損失低於自負額',40,25,30,200,80],['部分保障、自留足夠',150,120,30,200,80]];
const S={tab:0,sc:{b:{h:3,v:3,r:3,t:3,m:2,n:3},a:{h:2,v:2,r:3,t:2,m:1,n:2}},soc:{b:70,a:85},gov:{b:70,a:90},L:200,rate:1,cl:0,
ins:{C:300,E:250,D:30,L:200,R:80},rs:{ad:4200,ap:5000,al:452,pl:500,md:11,mp:12},path:'b',own:'',due:'',rev:'',doc:'',docStage:'a',docRes:null,log:[],img:{b:null,a:null},imgDates:{b:'',a:''},roi:{x:0,y:0,w:100,h:100},demoN:0,isDemo:true,imgRes:null,plain:'',tnfd:'',busy:'',err:''};

const f=(n,d=2)=>Number(n).toFixed(d);
const calcS=sc=>100*IND.reduce((s,x)=>s+x.w/100*(sc[x.k]-1)/4,0);
const lvl=(s,sc)=>(Object.values(sc).includes(5)||s>=60)?'高':s<30?'低':'中';
const mult=(q,hi)=>hi?1.6:q>=80?1:q>=60?1.3:1.6;
const Qf=(s,so,go)=>.5*(100-s)+.2*so+.3*go;
function prem(st){const sc=S.sc[st],s=calcS(sc),hi=lvl(s,sc)==='高',q=Qf(s,S.soc[st],S.gov[st]),m=mult(q,hi);return{s,q,m,p:S.L*S.rate/100*m,hi,lv:lvl(s,sc)}}
function claim(x){const I=Math.min(Math.max(x.E-x.D,0),x.L),U=x.C-I,G=Math.max(U-x.R,0);return{I,U,G,cov:U?x.R/U*100:100}}
const pc=l=>l==='低'?'lo':l==='中'?'mi':'hi';
const wan=n=>f(n,1)+' 萬';

function summary(){
  const b=prem('b'),a=prem('a'),cl=claim(S.ins);
  $('#sum').innerHTML=`
    <div class="metric-card"><div class="m-title">施工前生態 S</div><div class="m-value">${f(b.s)}</div><div class="m-desc">${b.lv}風險</div></div>
    <div class="metric-card"><div class="m-title">施工後生態 S</div><div class="m-value">${f(a.s)}</div><div class="m-desc">${a.lv}風險</div></div>
    <div class="metric-card"><div class="m-title">施工後年保費</div><div class="m-value">${wan(a.p)}</div><div class="m-desc">較前省 ${f(b.p-a.p,1)} 萬</div></div>
    <div class="metric-card"><div class="m-title">資金缺口 G</div><div class="m-value">${wan(cl.G)}</div><div class="m-desc">${cl.G>0?'資金不足':'無缺口'}</div></div>
  `;
}

function tabs(){
  $('#tabs').innerHTML=['核心評估','保費試算','理賠防護','復育監控','AI 智慧查核'].map((t,i)=>`<button class="${S.tab===i?'on':''}" onclick="S.tab=${i};draw()">${t}</button>`).join('');
}

function seg(st,k){
  return `<div class="seg">${[1,2,3,4,5].map(v=>`<button class="${S.sc[st][k]===v?'on':''}" onclick="S.sc.${st}.${k}=${v};draw()">${v}</button>`).join('')}</div>`;
}

function pAssess(){
  const b=prem('b'),a=prem('a');
  let h=`<h2>六大指標動態評估</h2><p style="color:var(--mut);margin-bottom:16px;font-size:13.5px;">依 TNFD LEAP 架構評估。點選 1–5 分調整指標。</p><div class="g g2">`;
  IND.forEach(x=>{
    h+=`<div class="c">
      <div class="row"><b style="font-size:14px;">${x.i} ${x.n}</b><span class="pill gy">權重 ${x.w}%</span></div>
      <div style="margin-top:12px; font-size:12px; color:var(--mut)">施工前評分：${S.sc.b[x.k]} 分</div>${seg('b',x.k)}
      <div style="margin-top:12px; font-size:12px; color:var(--mut)">施工後評分：${S.sc.a[x.k]} 分</div>${seg('a',x.k)}
    </div>`;
  });
  return h+`</div>`;
}

function pPrem(){
  const b=prem('b'),a=prem('a'),sc3=prem('a');
  const rows=[['改善前',b.s,S.soc.b,S.gov.b,b.q,b.m,b.p],['只改善生態',a.s,S.soc.b,S.gov.b,Qf(a.s,S.soc.b,S.gov.b),mult(Qf(a.s,S.soc.b,S.gov.b),a.hi),S.L*S.rate/100*mult(Qf(a.s,S.soc.b,S.gov.b),a.hi)],['三構面皆改善',a.s,S.soc.a,S.gov.a,sc3.q,sc3.m,sc3.p]];
  return `<h2>ESG 綜合評分與保費試算</h2><div class="g g2">
    <div class="c">
      <div class="in">社會構面設定（施工前）${num(S.soc,'b',0,100)}</div>
      <div class="in">治理構面設定（施工前）${num(S.gov,'b',0,100)}</div>
      <div class="in">社會構面設定（施工後）${num(S.soc,'a',0,100)}</div>
      <div class="in">治理構面設定（施工後）${num(S.gov,'a',0,100)}</div>
    </div>
    <div class="c">
      <div class="in">保障上限 L（萬）${num(S,'L')}</div>
      <div class="in">基準費率（%）${num(S,'rate')}</div>
    </div>
  </div>
  <div class="c tw" style="margin-top:16px">
    <table><tr><th>情境方案</th><th>S / 社 / 治</th><th>Q 值</th><th>倍數</th><th>預估年保費</th></tr>
    ${rows.map((r,i)=>`<tr class="${i==1?'hl':''}"><td>${r[0]}</td><td>${f(r[1])}/${r[2]}/${r[3]}</td><td>${f(r[4])}</td><td>${f(r[5],1)}</td><td>${wan(r[6])}</td></tr>`).join('')}
    </table>
  </div>`;
}

function pClaim(){
  const x=S.ins,r=claim(x),tot=x.C||1;
  return `<h2>損害發生與保險給付試算</h2><div class="c">
    <div class="row" style="margin-bottom:12px"><div class="chips">${CL.map((c,i)=>`<button class="${S.cl===i?'on':''}" style="padding:6px 14px;font-size:12px;" onclick="setCl(${i})">${c[0]}</button>`).join('')}</div></div>
    <div class="g metrics-grid" style="grid-template-columns: repeat(3,1fr);margin-top:12px;">
      <div class="metric-card"><div class="m-title">保險給付 I</div><div class="m-value">${wan(r.I)}</div></div>
      <div class="metric-card"><div class="m-title">自留支應</div><div class="m-value">${wan(Math.min(r.U,x.R))}</div></div>
      <div class="metric-card"><div class="m-title">資金缺口 G</div><div class="m-value">${wan(r.G)}</div></div>
    </div>
    <div class="bar" style="height:16px;border-radius:8px;display:flex;overflow:hidden;margin:16px 0;background:var(--card);border:1px solid var(--line);">
      <div style="width:${r.I/tot*100}%;background:#3b82f6"></div>
      <div style="width:${Math.min(r.U,x.R)/tot*100}%;background:#22c55e"></div>
      <div style="width:${r.G/tot*100}%;background:#ef4444"></div>
    </div>
  </div>
  <div class="g g2" style="margin-top:16px">
    <div class="c">
      <div class="in">總復育成本 C${num(x,'C')}</div>
      <div class="in">保險範圍損失 E${num(x,'E')}</div>
      <div class="in">自負額 D${num(x,'D')}</div>
      <div class="in">保障上限 L${num(x,'L')}</div>
      <div class="in">可動用自留 R${num(x,'R')}</div>
    </div>
    <div class="c">
      <div class="in">保險給付 I<b>${wan(r.I)}</b></div>
      <div class="in">自留支應<b>${wan(Math.min(r.U,x.R))}</b></div>
      <div class="in" style="color:#ef4444">資金缺口 G<b>${wan(r.G)}</b></div>
      <div class="in">資金覆蓋率<b>${f(r.cov,1)}%</b></div>
    </div>
  </div>`;
}
function setCl(i){S.cl=i;const c=CL[i];Object.assign(S.ins,{C:c[1],E:c[2],D:c[3],L:c[4],R:c[5]});draw()}

function pRest(){
  const r=S.rs,cl=claim(S.ins),it=[['進度達成率',r.ad/r.ap*100,100,80,'ad','ap'],['存活率',r.al/r.pl*100,90,85,'al','pl'],['監測完成率',r.md/r.mp*100,100,90,'md','mp'],['資金覆蓋率',cl.cov,100,80,null,null]];
  const ls=it.map(x=>{const v=isFinite(x[1])?x[1]:0;return{x,v,l:v>=x[2]?['綠燈','#22c55e','lo']:v>=x[3]?['黃燈','#eab308','mi']:['紅燈','#ef4444','hi']}});
  let h=`<h2>生態復育進度與指標監控</h2><div class="g g2">`;
  ls.forEach(({x,v,l})=>{
    h+=`<div class="c"><div class="row"><div><div class="m-title">${x[0]}</div><div class="m-value" style="font-size:22px;">${f(v,1)}%</div></div><span class="pill ${l[2]}">${l[0]}</span></div>
    ${x[4]?`<div class="row" style="margin-top:10px">${num(r,x[4])} / ${num(r,x[5])}</div>`:''}</div>`;
  });
  return h+`</div>`;
}

function search(st){
  const cur={...S.sc[st]},s0=calcS(cur),h0=lvl(s0,cur)==='高',q0=Qf(s0,S.soc[st],S.gov[st]),m0=mult(q0,h0);
  if(m0===1)return{m0,res:[]};
  const ks=IND.map(x=>x.k),out=[];
  (function rec(i,sc,ch){
    if(i===6){if(!ch)return;const s=calcS(sc),hi=lvl(s,sc)==='高',m=mult(Qf(s,S.soc[st],S.gov[st]),hi);if(m<m0)out.push({sc:{...sc},ch,s,q:Qf(s,S.soc[st],S.gov[st]),m});return}
    const k=ks[i];for(let v=1;v<=cur[k];v++){sc[k]=v;rec(i+1,sc,ch+(v<cur[k]?1:0))}sc[k]=cur[k]
  })(0,{...cur},0);
  out.sort((a,b)=>a.ch-b.ch||b.m-a.m||a.s-b.s);
  const mn=out.length?out[0].ch:0;
  return{m0,q0,res:out.filter(o=>o.ch===mn).sort((a,b)=>a.m-b.m||a.s-b.s).slice(0,3)}
}

async function callGemini(prompt, imageBase64List = [], jsonMode = false) {
  const response = await fetch('https://ai-backend-hkff.onrender.com/api/gemini', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt: prompt, images: imageBase64List, json_mode: jsonMode })
  });
  const result = await response.json();
  if (!response.ok || !result.success) throw new Error(result.error || '後端 API 請求失敗');
  return result.data;
}

const rub=IND.map(x=>x.k+' '+x.n+'：'+x.L.map((l,i)=>(i+1)+'='+l).join('；')).join('\n');
const nz=t=>String(t||'').replace(/\s+/g,'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]));
const DOC0='2026/03/02 施工日誌：基地鄰接既有溪流，已設置 30 公尺緩衝帶。累計清除植被約 12%（約 0.6 公頃／原有 5 公頃）。\n2026/03/09 設置透水鋪面與滯洪池，雨後局部仍有積水，排水控制尚未完整。\n2026/03/16 冷卻系統改採閉路循環，並持續監測排水溫度，每月出具報告。';

async function ai(key,fn){ S.busy=key; S.err=''; draw(); try{ await fn(); } catch(e){ S.err='錯誤：'+(e.message||e); } S.busy=''; draw(); }

function docRun(){return ai('doc',async()=>{
  if(!S.doc.trim())throw{message:'請先貼上文件內容'};
  const prompt='依下列評分表從文件擷取證據並建議各指標分數。只回傳 JSON 陣列：[{"k":"代碼","score":1到5,"quote":"原文","reason":"理由"}]\n'+rub+'\n文件：\n'+S.doc;
  const r=await callGemini(prompt,[],true);
  S.docRes=(Array.isArray(r)?r:(r.items||[])).map(it=>({...it,ok:!!nz(it.quote)&&nz(S.doc).includes(nz(it.quote))}));
})}

function adopt(i){const it=S.docRes[i];S.sc[S.docStage][it.k]=it.score;it.done=true;draw()}
function upTxt(inp){const f=inp.files[0];if(f)f.text().then(t=>{S.doc=t;S.docRes=null;draw()})}

function mk(seed,k){
  let s=seed;const R=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
  const c=document.createElement('canvas');c.width=400;c.height=300;const g=c.getContext('2d');
  g.fillStyle='#1e293b';g.fillRect(0,0,400,300);
  for(let i=0;i<200;i++){g.fillStyle='hsl('+(120+R()*40)+',40%,30%)';g.beginPath();g.arc(R()*400,R()*300,10+R()*20,0,7);g.fill()}
  const b=c.toDataURL('image/jpeg',.85);
  g.fillStyle='#64748b';g.fillRect(100,50,200*k,150*k);
  return [b,c.toDataURL('image/jpeg',.85)];
}
const gr=u=>new Promise(res=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=200;c.height=150;const g=c.getContext('2d');g.drawImage(i,0,0,200,150);const d=g.getImageData(0,0,200,150).data;let n=0,t=0;for(let q=0;q<d.length;q+=4){t++;if(d[q+1]>d[q]&&d[q+1]>d[q+2])n++;}res(n/t*100)};i.src=u});
async function pix(){if(S.img.b&&S.img.a){S.img.gb=await gr(S.img.b);S.img.ga=await gr(S.img.a);draw()}}
function setDemo(){const[b,a]=mk(123,.7);S.img={b,a};pix()}
function up(w,inp){const f=inp.files[0];if(f){S.img[w]=URL.createObjectURL(f);pix()}}

function imgRun(){return ai('img',async()=>{
  if(!S.img.b||!S.img.a)throw{message:'請先提供影像'};
  const r=await callGemini('比較植被變化，回傳 JSON：{"removal_pct":數字,"note":"說明"}',[S.img.b,S.img.a],true);
  S.imgRes=r;
})}

function planRun(){return ai('plan',async()=>{
  const sr=search(S.path);if(!sr.res.length)throw{message:'目前無改善路徑'};
  const t=sr.res.map((r,i)=>'路徑'+(i+1)+'：倍數 '+r.m+'×').join('\n');
  S.plain=await callGemini('把下列改善路徑翻成白話建議，100字內：\n'+t,[],false);
})}

function tnfdRun(){return ai('tnfd',async()=>{
  S.tnfd=await callGemini('依 TNFD LEAP 架構草擬自然風險揭露報告，200字。',[],false);
})}

function imgPanel(){
  const I=S.img;
  return `<div class="imgs">${['b','a'].map(w=>`<div>${I[w]?`<img src="${I[w]}">`:`<div class="ev" style="height:120px;display:grid;place-items:center;color:var(--mut)">尚未提供影像</div>`}<div class="row" style="margin-top:6px"><span style="font-size:12px;color:var(--mut)">${w==='b'?'施工前':'施工後'}</span><span style="font-size:12px;">${I[w==='b'?'gb':'ga']!=null?f(I.gb,1)+'%':''}</span></div></div>`).join('')}</div>
  <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
    <button class="btn" style="padding:8px 16px; font-size:12px; box-shadow:none;" onclick="setDemo()">載入示範影像</button>
    <button class="btn" style="padding:8px 16px; font-size:12px; box-shadow:none;" onclick="this.nextElementSibling.click()">上傳施工前</button><input type="file" accept="image/*" hidden onchange="up('b',this)">
    <button class="btn" style="padding:8px 16px; font-size:12px; box-shadow:none;" onclick="this.nextElementSibling.click()">上傳施工後</button><input type="file" accept="image/*" hidden onchange="up('a',this)">
  </div>`;
}

  return `<h2>AI 智慧查核與決策輔助</h2>
  <div class="ai">Secure Cloud AI 後端代理通道運行中</div>

  <div class="c">
    <div class="row"><b style="font-size:15px;">① 佐證文件智慧判讀</b><span class="tag">Gemini AI</span></div>

    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">${dchip('b','套用到施工前')}${dchip('a','套用到施工後')}<button class="btn" style="padding:6px 12px;font-size:12px;box-shadow:none;" onclick="S.doc=DOC0;S.docRes=null;draw()">載入示範日誌</button></div>
    <textarea placeholder="在此貼上施工日誌內容…" oninput="S.doc=this.value">${esc(S.doc)}</textarea>
    <div style="margin-top:10px"><button class="btn" style="padding:8px 18px;font-size:13px;" onclick="docRun()">${bs('doc')?'判讀中…':'開始 AI 判讀'}</button></div>
    ${(S.docRes||[]).map((it,i)=>{const x=IND.find(z=>z.k===it.k);return`<div class="ev"><div class="row"><b>${x.n}：建議 ${it.score} 分</b><span class="pill ${it.ok?'lo':'hi'}">${it.ok?'核對無誤':'不符'}</span></div><div style="color:var(--mut);font-size:12.5px;margin:4px 0">${esc(it.reason)}</div><blockquote>「${esc(it.quote)}」</blockquote>${it.ok?(it.done?`<span class="pill gy">已採用</span>`:`<button class="btn" style="padding:6px 12px;font-size:11px;" onclick="adopt(${i})">採用</button>`):''}</div>`}).join('')}
  </div>

  <div class="c" style="margin-top:16px">
    <div class="row"><b style="font-size:15px;">② 遙測影像 AI 交叉比對</b><span class="tag">Gemini AI</span></div>
    ${imgPanel()}
    <div style="margin-top:12px"><button class="btn" style="padding:8px 18px;font-size:13px;" onclick="imgRun()">${bs('img')?'分析中…':'執行 Gemini 驗證'}</button></div>
    ${S.imgRes?`<div class="ev" style="margin-top:10px;font-size:13px;"><b>AI 判讀結果：</b>移除比例 ${S.imgRes.removal_pct}%<br><span style="color:var(--mut)">${esc(S.imgRes.note)}</span></div>`:''}
  </div>

  <div class="c" style="margin-top:16px">
    <div class="row"><b style="font-size:15px;">③ 最佳保費改善路徑試算</b><span class="tag">AI 策略</span></div>
    <div style="display:flex;gap:8px;margin:10px 0;"><button class="btn" style="padding:6px 12px;font-size:12px;${S.path==='b'?'':'background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;'}" onclick="S.path='b';draw()">從施工前出發</button><button class="btn" style="padding:6px 12px;font-size:12px;${S.path==='a'?'':'background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;'}" onclick="S.path='a';draw()">從施工後出發</button></div>
    ${sr.m0===1?`<div style="color:var(--mut);font-size:13px">已達最低費率。</div>`:sr.res.map((r,i)=>`<div class="path"><b style="color:var(--accent)">#${i+1}</b>${IND.filter(x=>r.sc[x.k]!==cur[x.k]).map(x=>`<span class="t">${x.n} ${cur[x.k]}→${r.sc[x.k]}</span>`).join('')}<b class="r">${f(r.m,1)}×<div style="font-size:11px;color:var(--mut)">年保費 ${f(S.L*S.rate/100*r.m,1)}萬</div></b></div>`).join('')}
    <div style="margin-top:10px"><button class="btn" style="padding:8px 18px;font-size:13px;" onclick="planRun()">${bs('plan')?'轉換中…':'生成白話建議'}</button></div>
    ${S.plain?`<div class="ev" style="margin-top:10px">${esc(S.plain)}</div>`:''}
  </div>

  <div class="c" style="margin-top:16px">
    <div class="row"><b style="font-size:15px;">④ TNFD 自然風險揭露草稿</b><span class="tag">AI 生成</span></div>
    <div style="margin-top:10px"><button class="btn" style="padding:8px 18px;font-size:13px;" onclick="tnfdRun()">${bs('tnfd')?'草擬中…':'生成揭露報告'}</button></div>
    ${S.tnfd?`<textarea style="margin-top:10px;min-height:160px;" oninput="S.tnfd=this.value">${esc(S.tnfd)}</textarea>`:''}
  </div>`;
}

function draw(){
  tabs();
  summary();
  $('#pane').innerHTML = [pAssess, pPrem, pClaim, pRest, pAudit2][S.tab]();
  document.querySelectorAll('#pane input').forEach(e=>e.addEventListener('change',()=>{
    const o={ins:S.ins,rs:S.rs,soc:S.soc,gov:S.gov,S:S}[e.dataset.o];
    if(o) o[e.dataset.k]=e.type==='number'?Math.max(0,Number(e.value)||0):e.value;
    if(e.dataset.o==='ins')S.cl=-1;
    draw();
  }));
}

draw();
setDemo();
